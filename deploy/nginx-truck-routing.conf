# /etc/nginx/sites-available/truck-routing  (certbot --nginx adds the 443 block)
server {
    listen 80;
    listen [::]:80;
    server_name truck-routing.31-97-230-124.sslip.io;

    access_log /var/log/nginx/truck-routing.access.log;
    error_log /var/log/nginx/truck-routing.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
